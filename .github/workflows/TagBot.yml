name: TagBot

# Tag a version that is already registered, and make a release for it. A version of this package is
# registered in a registry, and nothing in this repository learns that on its own. TagBot reads the
# registry, finds every registered version this repository holds no tag for, and makes the tag and
# the release.
#
# It runs once a day, so a registration is picked up without anyone remembering to start it. Start it
# by hand from the Actions tab to pick one up at once.
#
# `registry` names the registry of this organisation. Drop that line to read the General registry
# instead: TagBot reads one registry and takes General when no line names another.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# TagBot reads the token the step below mints, and nothing here reads `GITHUB_TOKEN`. This leaves
# that token able to read this repository and to do nothing else.
permissions:
  contents: read

jobs:
  TagBot:
    runs-on: ubuntu-latest
    steps:
      # This repository tags with the TagBot GitHub App of the organisation. Every repository of the
      # organisation moves to that app, one at a time, so that a single app tags them all and no
      # repository keeps a key of its own for the job.
      #
      # The app belongs to the organisation rather than to a person, and this step mints a token that
      # lives one hour and reaches this repository alone. Two organisation secrets name the app:
      # `TAGBOT_APP_CLIENT_ID` and `TAGBOT_APP_KEY`, the private key of the app.
      #
      # The token carries one property `GITHUB_TOKEN` does not. GitHub starts no workflow from an
      # event that `GITHUB_TOKEN` wrote, so a tag it pushes starts nothing. A tag this token pushes
      # starts any workflow whose triggers name a tag push. This repository holds no such workflow
      # today, as it carries its features in the README and builds no documentation.
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ secrets.TAGBOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAGBOT_APP_KEY }}
          # Every permission this run needs, and no other. Without these four lines the token carries
          # whatever the installation carries, and the app is installed on the whole organisation: a
          # permission added there for another package would reach this run as well.
          #
          # `workflows` is not optional here. A released commit that touches a file under
          # `.github/workflows` cannot be tagged by a token that carries no such permission — GitHub
          # rejects the ref push outright.
          permission-contents: write
          permission-issues: read
          permission-pull-requests: read
          permission-workflows: write
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ steps.token.outputs.token }}
          registry: JuliaSatcomFramework/JuliaRegistry
